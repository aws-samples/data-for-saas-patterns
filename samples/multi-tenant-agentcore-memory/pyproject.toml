[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-tenant-agentcore-memory"
version = "0.1.0"
description = "Tenant-isolated persistent agent memory for Strands Agents backed by Amazon Bedrock AgentCore Memory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["strands", "agents", "memory", "agentcore", "bedrock", "aws", "multi-tenant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# NOTE: strands-agents and bedrock-agentcore are version-coupled. bedrock-agentcore
# 1.23.0 imported `BidiAfterInvocationEvent` from strands.experimental.hooks.events,
# a symbol that strands-agents removed in 1.56.0 — so 1.23.0 + strands 1.56.0 fails
# at import with `ImportError: cannot import name 'BidiAfterInvocationEvent'`.
# bedrock-agentcore 1.23.1 fixes that import, so it is compatible with strands-agents
# 1.56.0. Floor bedrock-agentcore at 1.23.1 (the fixed release) and strands-agents at
# 1.56.0; no upper bounds are needed.
dependencies = [
    "boto3>=1.34.0",
    "cachetools>=5.3.0",
    "strands-agents>=1.56.0",
    "bedrock-agentcore[strands-agents]>=1.23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
agentcore = [
    "bedrock-agentcore[strands-agents]>=1.23.1",
    "bedrock-agentcore-starter-toolkit>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/aws-samples/data-for-saas-patterns/tree/main/samples/multi-tenant-agentcore-memory"
Documentation = "https://github.com/aws-samples/data-for-saas-patterns/tree/main/samples/multi-tenant-agentcore-memory#readme"
Repository = "https://github.com/aws-samples/data-for-saas-patterns"
Issues = "https://github.com/aws-samples/data-for-saas-patterns/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_memory"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agentcore_memory/",
    "examples/",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
# Makes src/ and examples/ importable without sys.path hacks or editable install.
pythonpath = ["src", "examples", "."]

[tool.pytest.ini_options.markers]
integration = "marks tests as integration (require live AWS resources)"
