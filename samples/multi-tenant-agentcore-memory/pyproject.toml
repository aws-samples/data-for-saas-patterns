[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-tenant-agentcore-memory"
version = "0.1.0"
description = "Tenant-isolated persistent agent memory for Strands Agents backed by Amazon Bedrock AgentCore Memory"
readme = "README.md"
license = { text = "MIT-0" }
requires-python = ">=3.10"
keywords = ["strands", "agents", "memory", "agentcore", "bedrock", "aws", "multi-tenant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# NOTE: strands-agents and bedrock-agentcore are version-coupled, and the session
# manager relies on SDK internals that are not a public API (the memory client's
# gmcp_client / gmdp_client, config mutation, and the RepositorySessionManager
# tracking fields). The unit tests stub both SDKs, so the ranges below are the
# versions tests/sdk/test_sdk_compat.py has run against the real SDKs. Widen
# them only after running that test on the new versions.
dependencies = [
    "boto3>=1.34.0",
    "cachetools>=5.3.0",
    "strands-agents>=1.65.0,<1.66",
    "bedrock-agentcore[strands-agents]>=1.26.1,<1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
agentcore = [
    "bedrock-agentcore[strands-agents]>=1.26.1,<1.27",
    "bedrock-agentcore-starter-toolkit>=0.3.14,<0.4",
]

[project.urls]
Homepage = "https://github.com/aws-samples/data-for-saas-patterns/tree/main/samples/multi-tenant-agentcore-memory"
Documentation = "https://github.com/aws-samples/data-for-saas-patterns/tree/main/samples/multi-tenant-agentcore-memory#readme"
Repository = "https://github.com/aws-samples/data-for-saas-patterns"
Issues = "https://github.com/aws-samples/data-for-saas-patterns/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore_memory"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agentcore_memory/",
    "examples/",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
# Makes src/ and examples/ importable without sys.path hacks or editable install.
pythonpath = ["src", "examples", "."]

[tool.pytest.ini_options.markers]
integration = "marks tests as integration (require live AWS resources)"
