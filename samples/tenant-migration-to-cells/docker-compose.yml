# Local stand-in for the sandbox: V1 sources on PG 15, V2 targets on PG 18, MinIO as S3.
services:
  v1-messaging:
    image: postgres:15
    environment: { POSTGRES_PASSWORD: local, POSTGRES_DB: messaging }
    ports: ["5415:5432"]
    volumes: ["./sql/v1/messaging.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30 }

  v1-auth:
    image: postgres:15
    environment: { POSTGRES_PASSWORD: local, POSTGRES_DB: auth }
    ports: ["5416:5432"]
    volumes: ["./sql/v1/auth.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30 }

  v2-cell-messaging:
    image: postgres:18
    environment: { POSTGRES_PASSWORD: local, POSTGRES_DB: messaging }
    ports: ["5418:5432"]
    volumes: ["./sql/v2/cell_messaging.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30 }

  v2-management:
    image: postgres:18
    environment: { POSTGRES_PASSWORD: local, POSTGRES_DB: management }
    ports: ["5419:5432"]
    volumes: ["./sql/v2/management.sql:/docker-entrypoint-initdb.d/01.sql:ro"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 2s, retries: 30 }

  s3:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: local, MINIO_ROOT_PASSWORD: localsecret }
    ports: ["9000:9000", "9001:9001"]
